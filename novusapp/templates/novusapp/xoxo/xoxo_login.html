{% extends 'novusapp/base1.html' %}
{% load static %}
{% block head %}
<style>
  .text-center {
    text-align: center!important;
    background-color: blue;
    padding: 4px;
    margin: auto;
}
</style>  
{% endblock head %} 
{% block right_col %}
<div class="right_col" role="main">
    <div class="">
      <div class="page-title">
          {% include 'novusapp/alertmsg/msg.html' %}
        <div class="title_left">
          <h3><small></small></h3>
        </div>
      </div>
      
      <div class="clearfix"></div>

      <div class="row">
        <div class="col-md-12">
              <div class="x_panel">
                <div class="x_title">
                  <div class="text-center">
                      <img src="{% static 'images/xoxo.svg' %}" alt="..." class="img-fluid profile_img_large mx-auto d-block">
                  </div>
                  <ul class="nav navbar-right panel_toolbox">     
                  </ul>
                </div>
                <div class="clearfix"></div>
                <div class="row">
                  <div class="col-md-12 col-sm-12 ">
                    <div class="x_panel">
                      <div class="x_title">
                        <h2 class='font-weight-bold'>Login to your Plum account</h2>
                        <ul class="nav navbar-right panel_toolbox">
                        </ul>
                        <div class="clearfix"></div>
                      </div>
                      <div class="x_content">
                        <br>
                        <form id="demo-form2" method="post" data-parsley-validate="" class="form-horizontal form-label-left" novalidate="">
                          {% csrf_token %}
                          <div class="item form-group">
                            <label class="col-form-label col-md-3 col-sm-3 label-align" for="first-name">Email/Mobile Number <span class="required">*</span>
                            </label>
                            <div class="col-md-4 col-sm-4 ">
                              <input type="text" name="email" id="email" required="required" class="form-control ">
                            </div>
                          </div>
                          <div class="ln_solid"></div>
                          <div class="item form-group">
                            <div class="col-md-6 col-sm-6 offset-md-3">
                              <button type="submit" class="btn btn-lg btn-success">Continue</button>
                            </div>
                          </div>
      
                        </form>
                      </div>
                    </div>
                  </div>
                </div>

                
              
          </div>
        </div>
      </div>
    </div>
  </div>
  <!-- /page content -->  
  
{% endblock right_col %}
 {% block script %}
 {% endblock %}
