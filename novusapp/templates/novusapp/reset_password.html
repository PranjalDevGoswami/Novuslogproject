{% extends "novusapp/registration_login_base.html" %}

{% load static %}

{% block title %} login {% endblock %}

{% block head %}
  

{% endblock %}

{% block content %}
    <div class="limiter">
        <div class="container-login100">
            <div class="wrap-login100">
                <div class="login100-pic js-tilt" data-tilt>
                    <img src="{% static 'images/novus_logo.png' %}" alt="IMG">
                </div>
                <form class="login100-form validate-form" method="post" action="{% url 'reset-password' token %}">
                    {% csrf_token %}
                    <span class="login100-form-title">
                        Reset Password
                    </span>
                    <div class="x_content bs-example-popovers">
                    <!-- Display messages if any -->
                        {% include 'novusapp/alertmsg/msg.html' %}
                    </div>    

                    <div class="wrap-input100 validate-input" data-validate = "Password is required">
						<input class="input100" type="password" name="password" placeholder="Password" required="required">
						<span class="focus-input100"></span>
						<span class="symbol-input100">
							<i class="fa fa-lock" aria-hidden="true"></i>
						</span>
					</div>

                    <div class="wrap-input100 validate-input" data-validate = "Password is required">
						<input class="input100" type="password" name="password2" placeholder="Confirm Password" required="required">
						<span class="focus-input100"></span>
						<span class="symbol-input100">
							<i class="fa fa-lock" aria-hidden="true"></i>
						</span>
					</div>
                
                
                    <div class="container-login100-form-btn">
                        <button type="submit" class="login100-form-btn">
                            Submit
                        </button>
                    </div>
                </form>
                
            </div>
        </div>
    </div>
{% endblock %}  

{% block scripts %}

<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script src="{% static 'js/tiltinganimation.js' %}"></script>

{% endblock %}
